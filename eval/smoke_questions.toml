[[q]]
id = "REG-06"
type = "bitfield"
question = "Where is the SCIFA FIFO control register, and how do I set the receive FIFO trigger to 8 bytes in asynchronous mode?"
answer = "FCR: offset H'0C, R/W, 16-bit, initial H'0000. The receive trigger is RTRG[1:0] (bits b7-b6). Asynchronous mode: 00 = 1, 01 = 4, 10 = 8, 11 = 14 (clock synchronous mode: 00 = 1, 01 = 2, 10 = 8, 11 = 14). So set RTRG[1:0] = 10b for 8. RTRG is only valid when the RTRGS bit in FTCR is 0; when RTRGS = 1 the FTCR.RFTC[4:0] setting is used instead. RDF is set and an RXI request is generated when the number of receive FIFO entries rises to or above the trigger number."
key_facts = ["H'0C", "RTRG[1:0]", "RTRGS", "RFTC[4:0]"]
