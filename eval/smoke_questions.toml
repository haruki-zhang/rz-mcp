question = "What is the Cortex-A55 address of GTCCRD for GPT channel 3 (GPT32E3), and what are its reset value and access size?"
answer = "GPT base address is H'0_1004_8000 (Cortex-A55; H'4004_8000 CM33 Secure, H'5004_8000 CM33 Non-Secure) and channels are spaced H'0100 × m (m = 0 to 7). GTCCRD offset = H'5C + H'0100 × m (address H'1004_805C + H'0100 × m), so for m = 3 the CA55 address is H'0_1004_835C. Reset value H'FFFF_FFFF, 32-bit access. Note the map is not alphabetical: GTCCRE is at H'58 and GTCCRD at H'5C."
