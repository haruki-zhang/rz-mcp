[[q]]
id = "BRD-04"
type = "board"
question = "I just received the RZ/G3L Evaluation Board Kit. What does the kit consist of, and which software package does the Quick Start Guide recommend for a first evaluation?"
answer = "The EVK is a module board (SOM) plus a carrier board; the module complies with the SMARC v2.1 standard. Main contents (as printed): RZ/G3L Module Board (SMARC2.1), Common Carrier Board, USB Cable (USB Type-A to Micro B), SMARC Camera Adaptor, SMARC Dual LVDS-HDIM [sic] Adaptor, SMARC DSI-HDMI Adaptor, SMARC RGB-HDMI Adaptor, SMARC Breakout Adaptor, Spacer and Screws for ML2 [sic] Cards. For users new to RZ/G the QSG recommends starting with the RZ/G HMI SDK: use the pre-built image in the package to create a bootable microSD card and boot Linux immediately (demo applications and a toolchain installer are included). VLP and, for expert users who want the latest LTS kernel, the RZ Linux BSP Plus are the alternatives."
key_facts = ["SMARC v2.1", "HMI SDK", "microSD", "BSP Plus"]
