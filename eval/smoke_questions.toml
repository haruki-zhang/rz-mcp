[[q]]
id = "SEC-01"
type = "section_locate"
question = "Where does the RZ/G3L hardware manual describe the boot mode pin settings, and which pins select the boot CPU and the boot device?"
answer = "Section 1.9 Boot Operation, 1.9.1 CPU (CA55 or CM33) Normal Execution Mode (p.147). Table 1.9-1 Boot CPU Selection Pin: BOOT_CPU_SELECT 0 = CM33 cold boot, 1 = CA55 cold boot. Table 1.9-2 Boot Device Selection Pins (BOOT_MODE2/BOOT_MODE1/BOOT_MODE0): 000 boot mode 0 eSD (SD/eMMC ch0); 001 boot mode 1 eMMC 3.3 V; 010 boot mode 2 serial flash (xSPI) 3.3 V; 011 boot mode 3 SCIF download (SCIF ch0); 100 not assigned; 101 boot mode 5 eMMC 1.8 V; 110 boot mode 6 serial flash 1.8 V. eSD/eMMC are CA55-boot only; serial flash and SCIF download work for CA55 and CM33 boot. Per-mode details: 1.9.1.1.1 to 1.9.1.1.4 (pp.148-159); loader allocation: 1.9.1.2 (pp.160-168). Related: 4.4.1.6 Table 4.4-2 (p.398) - do not change BOOT_MODE pins while SYS_RST# is asserted and until the mode is confirmed; SYS_LSI_MODE (4.3.3.2.58, p.360) captures BOOT_MODE[2:0] (bits 6-4) and BOOT_CPU_SELECT (bit 0) at the rising edge of SYS_RST#."
