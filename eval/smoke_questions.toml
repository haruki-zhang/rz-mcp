[[q]]
id = "SEC-02"
type = "cross_section"
question = "I want to use SCIF ch5 from Linux on the Cortex-A55. Which CPG registers and bits do I need to set to supply its clock, bring it out of module standby, and release its reset?"
answer = "Procedure (4.4.6.3 + 4.5.3.2.1): start the clock, confirm it, release module stop, release reset, confirm reset release. (1) Clock: CPG_CLKON_SCIF (<CPG_base> + 0584h, initial 0000_0000h): CLK5_ON (bit 5) = 1 with CLK5_ONWEN (bit 21) = 1 supplies SCIF5_CLK_PCK; confirm with CPG_CLKMON_SCIF (<CPG_base> + 0704h) CLK5_MON. (2) Module standby: for SCIF ch5 the MSTOP bit is in CPG_BUS_MCPU3_MSTOP (<CPG_base> + 0B90h) bit 4, MSTOP4_ON (BUS_PERI_HPB0_MSTOP_MHSCIF_5); 0 = normal operation, 1 = module stop state. The register's initial value is 0000_0000h, so this only needs writing (0, with MSTOP4_ON_WEN (bit 20) = 1) if the module was previously put into module standby. When exiting module standby set the clock bit to 1 first, then the MSTOP bit to 0. (SCIF ch0-ch4 instead use CPG_BUS_MCPU2_MSTOP bits 1-5.) (3) Reset: CPG_RST_SCIF (<CPG_base> + 0884h) UNIT5_RSTB (bit 5) = 1 with UNIT5_RST_WEN (bit 21) = 1 releases SCIF5_RST_SYSTEM_N; confirm with CPG_RSTMON_SCIF (<CPG_base> + 0A04h) RST5_MON. CPG_base = 0_1101_0000h on the Cortex-A55."
key_facts = ["CPG_CLKON_SCIF", "0584h", "CLK5_ON", "CPG_BUS_MCPU3_MSTOP", "0B90h", "MSTOP4_ON", "CPG_RST_SCIF", "0884h", "UNIT5_RSTB"]
