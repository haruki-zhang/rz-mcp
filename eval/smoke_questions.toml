[[q]]
id = "REG-05"
type = "bitfield"
question = "What are the clock source options of SCIFA SMR.CKS[1:0]? Can I select P0ϕ/16 on SCIF channel 0?"
answer = "CKS[1:0] are SMR bits b1-b0 (SMR: offset H'00, 16-bit, initial H'0000) and select the baud rate generator clock: 00 = 1 × P0ϕ (n = 0), 01 = 1/4 × P0ϕ (n = 1), 10 = 1/16 × P0ϕ (n = 2), 11 = 1/64 × P0ϕ (n = 3), where P0ϕ is SCIFn_CLK_PCK (n = 0 to 5). The 1/16 setting is not applicable to channel 0; it is only applicable to channels 1 to 5 (the P0ϕ/16 clock is not input to the channel 0 interface). So no: on SCIF0 use CKS = 00, 01 or 11."
key_facts = ["CKS[1:0]", "1/16", "1/64", "SCIFn_CLK_PCK", "channels 1 to 5"]
