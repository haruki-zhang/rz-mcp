[[q]]
id = "BRD-03"
type = "board"
question = "RZ SMARC Carrier Board II 在默认 VBUS_SEL 设置下需要什么规格的 USB-PD 电源适配器？SW_MODE[4] 为 ON 和 OFF 时有什么区别？"
answer = "VBUS_SEL is set to 3 by default (15 V). Table 2.4 Minimum USB-PD Power Adapter Requirements: SW_MODE[4] = ON, VBUS_SEL = 3 -> 15 V, 2A, 30 W; SW_MODE[4] = OFF, VBUS_SEL = 3 -> 15 V, 4A, 60 W. SW_MODE[4] is not a boot-mode switch; it selects the minimum current requested from the USB-C power input. The adapter is not supplied; Renesas verified operation with a PowerPort III USB-PD power adapter (M/N: A2712121) and a PowerLine II USB Type-C cable (M/N: A8485011)."
key_facts = ["VBUS_SEL", "30 W", "60 W", "A2712121"]
