[[q]]
id = "SEC-04"
type = "cross_section"
question = "The WDT chapter says that once WDTCNT.WDTEN is set the watchdog cannot be stopped until reset. Is there any way to pause WDT CH0 counting, for example while the CPU is halted in a JTAG debugger?"
answer = "WDT side (5.4.3.1): WDTEN (WDTCNT bit 0) - once enabled the WDT does not stop until reset; for debugging the internal counter can be paused with the CNTSTOP signal. The control is in SYSC (4.3.4.2 WDT Stop Control Function): SYS_WDT0_CTRL at SYSC base H'0_1102_0000 + H'0250 (32-bit, initial H'0000_0000; SYS_WDT1_CTRL = H'0260, SYS_WDT2_CTRL = H'0270). WDTSTOP (bit 0): 1 = stop counting and hold the counter value, 0 = continue counting. WDTSTOPMASK (bit 16): 0 = WDT0 counting stops during debugging (CoreSight WDT stop signal; default), 1 = WDT0 keeps counting during debugging."
key_facts = ["CNTSTOP", "SYS_WDT0_CTRL", "H'0_1102_0000", "H'0250", "WDTSTOP", "WDTSTOPMASK"]
