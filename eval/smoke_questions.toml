# RZ/G3L documentation MCP server - smoke test question set (ground truth)
#
# Every answer / key_fact was copied from the cited PDF pages (pdftotext -layout),
# not from memory.
#
# Conventions
# - pages: 1-based PDF page index. For every document used here this equals the
#   printed page number, EXCEPT R01US0479EJ0115 (Linux WDT driver manual), where
#   printed page = PDF page - 6 (PDF p.7 is printed "Page 1 of 16").
# - key_facts: short strings that appear verbatim on the cited pages. The PDFs
#   print hex prefixes with a typographic apostrophe (H’xxxx, U+2019); key_facts
#   use ASCII H'xxxx, so graders should normalise ’ -> ' (and collapse
#   whitespace) before matching.
# - derived_facts (optional): values computed from printed facts (e.g. absolute
#   address = base + offset). They are NOT printed verbatim in the manual but are
#   what a correct answer should state.
# - For negative questions, key_facts are phrases from the documents that a
#   correct "not in the provided documents" answer should cite.

