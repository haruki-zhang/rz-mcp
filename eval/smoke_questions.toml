[[q]]
id = "REG-07"
type = "register_lookup"
question = "After the board comes back from a watchdog reset, how can firmware tell which WDT channel caused the system reset? Give the register and its Cortex-A55 address."
answer = "Read CPG_WDTOVF_RST at <CPG_base> + 0B10h. CPG_base = 0_1101_0000h (Cortex-A55; 5101_0000h CM33 Non-Secure, 4101_0000h CM33 Secure), so the CA55 address is 0_1101_0B10h. 32-bit, initial 0000_0000h. WDTOVF0 (bit 0) = 1: system reset generated by WDT channel 0 (Cortex-A55 Non-Secure); WDTOVF1 (bit 1): channel 1 (Cortex-A55 Secure); WDTOVF2 (bit 2): channel 2 (Cortex-M33). The bits are cleared by writing 1, together with the write-enable bits WDTOVF0_WEN/WDTOVF1_WEN/WDTOVF2_WEN (bits 16/17/18). If no system reset was applied (masked by the WDTRSTSEL register), the source must be identified from the WDT interrupt and status register instead."
key_facts = ["CPG_WDTOVF_RST", "0B10h", "0_1101_0000h", "WDTOVF0", "WDTOVF2"]
derived_facts = ["0_1101_0B10h"]
