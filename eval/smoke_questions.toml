type = "register_lookup"
question = "I'm writing a polled early-boot UART driver for SCIF ch0 on the Cortex-A55. What are the addresses and access sizes of FTDR and FSR, and what is the reset value of FSR?"
answer = "SCIFA channel 0 base (Cortex-A55 address space) is H'0_100A_C000 (H'400A_C000 CM33 Secure, H'500A_C000 CM33 Non-Secure). FTDR: offset H'06, write-only, 8-bit, initial value undefined -> H'0_100A_C006. FSR: offset H'08, R/W, 16-bit, initial value H'0020 -> H'0_100A_C008. H'0020 means TDFE (bit 5) = 1, i.e. the transmit FIFO holds no more data than the transmit trigger number."
