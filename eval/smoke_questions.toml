[[q]]
id = "REG-08"
type = "bitfield"
question = "如何把 SDHI0 的时钟分频设为 1/2？CPG_SDHI_DDIV 的地址、复位值和相关位是什么？"
answer = "CPG_SDHI_DDIV is at <CPG_base> + 0218h, 32-bit, initial value 0000_0222h. DIVSDHI0_SET[1:0] (bits 1-0) sets the DIV_SDHI0 ratio: 00b = 1/1, 01b = 1/2, 10b = 1/4, other = setting prohibited; initial 2h (1/4). (DIVSDHI1_SET = bits 5-4, DIVSDHI2_SET = bits 9-8.) Write DIVSDHI0_SET = 01b with its write-enable DIVSDHI0_WEN (bit 16) = 1 in the same write (bits 20/24 are the WEN bits for SDHI1/SDHI2). The setting can be changed dynamically while the clock is operating; the 1/1 setting is prohibited if 800 MHz is selected in CPG_SDHI_DSEL. Source clock is the SEL_SDHIn output."
key_facts = ["CPG_SDHI_DDIV", "0218h", "0000_0222h", "DIVSDHI0_SET", "DIVSDHI0_WEN", "800 MHz"]
