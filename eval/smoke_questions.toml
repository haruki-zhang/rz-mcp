[[q]]
id = "REG-01"
type = "register_lookup"
question = "What is the absolute address and reset value of WDTSET for the Cortex-M33 watchdog (WDT CH2) when the Cortex-M33 accesses it through its Secure address space? What address would the Cortex-A55 use for the same register?"
answer = "WDT CH2 is the WDT that checks the Cortex-M33. Its base address is H'4280_0000 in the Cortex-M33 Secure address space (H'5280_0000 in Cortex-M33 Non-Secure, H'0_1280_0000 in the Cortex-A55 address space). WDTSET_2 is at offset H'0004, so the address is H'4280_0004 (CM33 Secure) and H'0_1280_0004 (CA55). WDTSET_2 is R/W, 32-bit access, initial value H'FFF0_0000."
key_facts = ["H'4280_0000", "H'0_1280_0000", "H'0004", "H'FFF0_0000", "WDTSET_2"]
derived_facts = ["H'4280_0004", "H'0_1280_0004"]
[[q.source]]
doc_no = "R01UH1153EJ0110"
rev = "1.10"
pages = [1189, 1190]
section = "5.4.2"

[[q]]
id = "REG-02"
type = "bitfield"
question = "WDTSET 寄存器里设置看门狗超时周期的是哪几位？可设置的范围是多少？WDTn_CLK = 24 MHz 时，复位值对应的超时时间是多少？"
answer = "The period field is WDTTIME[11:0] = WDTSET[31:20] (bits 19 to 0 are reserved, read as 0). Settable values: H'000 to H'FFF. Watchdog timer cycle = WDTn_CLK cycle × 1024 × 1024 × (WDTTIME + 1); with WDTn_CLK = 24 MHz the cycle is set in 43.69 msec units from 43.69 msec to 178956.97 msec. The reset value of WDTTIME is all 1 (H'FFF, WDTSET = H'FFF0_0000), which is the maximum, 178956.97 msec. WDTTIME cannot be written while the watchdog timer is running. Caution: the value compared when the interrupt occurs is WDTSET[31:0] + H'000F_FFFF."
key_facts = ["WDTSET[31:20]", "H'000", "H'FFF", "43.69", "178956.97", "H'000F_FFFF"]
[[q.source]]
doc_no = "R01UH1153EJ0110"
rev = "1.10"
pages = [1192]
section = "5.4.3.2"

[[q]]
id = "REG-03"
type = "bitfield"
question = "How does software service (kick) the RZ/G3L watchdog so that it does not reset the system, and is there a timing constraint on consecutive writes?"
answer = "Write 1 to INTDISP (bit 0) of WDTINT_n (offset H'000C, R/W, 32-bit, initial H'0000_0000) within the time set by WDTSET. WDTINT reads the interrupt status (INTDISP read: 1 = with interrupt, 0 = without), clears the interrupt (write 1; write 0 = no change) and clears the WDT counter. If INTDISP is not set to 1 within the WDTSET period, the WDTINT pin (interrupt) is asserted; if it is still not set within the next WDTSET period, the WDTRSTB reset request is asserted. For consecutive writes to WDTINT, leave an interval of 5 × P0ϕ + 5 × OSCCLK or more, otherwise the register is not written. WDTRSTB and WDTINT cannot be masked."
key_facts = ["WDTINT", "INTDISP", "H'000C", "WDTRSTB"]
