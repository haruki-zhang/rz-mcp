[[q]]
id = "SEC-03"
type = "cross_section"
question = "Does a WDT CH0 overflow reset the whole RZ/G3L by default? If not, what must be configured so that a WDT CH0 (Cortex-A55 Non-Secure) overflow causes a system reset and also asserts the WDTOVF_PERROUT# pin?"
answer = "No. Routing of WDT reset requests is done by the CPG register CPG_WDTRST_SEL (<CPG_base> + 0B14h, 32-bit, initial 0000_0088h - only reserved bits 3 and 7 read 1; all WDTRSTSELn bits are 0 = masked after reset). Set WDTRSTSEL0 (bit 0) = 1 to apply a system reset on a CH0 request and WDTRSTSEL4 (bit 4) = 1 to assert WDTOVF_PERROUT#, with the write-enable bits WDTRSTSEL0_WEN (bit 16) and WDTRSTSEL4_WEN (bit 20) set to 1 in the same write. Bits 8-10 (WDTRSTSEL8/9/10) instead select only a Cortex-A55/Cortex-M33 cold reset. The WDT chapter says to set CPG_WDTRST_SEL[4] only when CPG_WDTRST_SEL[0] = 1; otherwise WDTOVF_PERROUT# is asserted without a system reset. On a WDT system reset, WDTOVF_PERROUT outputs a low pulse for 64 cycles of the 24-MHz clock; afterwards CPG_WDTOVF_RST identifies the channel."
key_facts = ["CPG_WDTRST_SEL", "0B14h", "0000_0088h", "WDTRSTSEL0", "WDTRSTSEL4"]
