[[q]]
id = "SW-01"
type = "software"
question = "In the RZ Linux BSP, how is the RZ/G3L watchdog enabled (kernel config symbol, driver source file, device-tree compatible string), and which WDT channels does the driver support on RZ/G3L?"
answer = "Kernel config: Device Drivers -> Watchdog Timer Support -> Renesas RZ/G2L WDT Watchdog, i.e. CONFIG_RENESAS_G2LWDT=y; driver source drivers/watchdog/rzg2l_wdt.c. RZ/G3L node in arch/arm64/boot/dts/renesas/r9a08g046.dtsi: wdt0: watchdog@12800800 with compatible = \"renesas,r9a08g046-wdt\", \"renesas,rzg2l-wdt\", reg = <0 0x12800800 0 0x400>, clocks R9A08G046_WDT0_PCLK / R9A08G046_WDT0_CLK (clock-names \"pclk\", \"oscclk\"), interrupt-names \"wdt\", \"perrout\". RZ/G3L is supported on kernel v6.12; it supports WDT0 for Non-Secure CPU mode and WDT1 for Secure CPU mode. Timeout range 43,69 ms to 178956,97 ms (as printed). Table 4-1 device nodes: WDT0 = /dev/watchdog0, WDT1 = /dev/watchdog1 (major 245)."
key_facts = ["CONFIG_RENESAS_G2LWDT", "rzg2l_wdt.c", "renesas,r9a08g046-wdt", "v6.12", "WDT1"]
