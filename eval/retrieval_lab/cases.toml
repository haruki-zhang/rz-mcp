# Retrieval lab cases (experiment only; not wired into the server).
#
# pos: agent-style keyword queries with the page(s) that hold the answer. Pages were checked against the
#      page text in data/rz.db. The ticket-derived ones carry technical content only (no customer data).
# neg: queries whose identifying term does not occur anywhere in the indexed documents. A good tool says
#      so (returns nothing, or names the term that was not found) instead of padding with partial matches.

