# Document catalog: the single source of truth for document metadata.
# The directory tree under docs/ only groups files by owner (device / board / family);
# relations that a tree cannot express (one doc -> many devices, one board -> many SoMs)
# live here. The indexer reads ONLY files listed here.
#
# doc_type : hw_manual | datasheet | app_note | quick_start | board_manual | schematic | bom
#            | errata | sw_manual | component_datasheet
# index    : fulltext (sections + page text + FTS), registers (HW UM register tables), bom (rows)
# outline  : bookmarks (PDF bookmarks = section tree) | schematic (use "Design Hierarchy"
#            bookmarks = sheet names) | none (page-level chunks only)
schema_version = 1

[devices.rzg3l]
name = "RZ/G3L"
family = "RZ/G"

[devices.rzg3se]
name = "RZ/G3SE"
family = "RZ/G"
note = "Covered by the same HW UM / datasheet as RZ/G3L"

[boards.rzg3l-evk]
name = "RZ/G3L Evaluation Board Kit"
devices = ["rzg3l"]
components = ["rzg3l-smarc-module", "rz-smarc-carrier2"]

[boards.rzg3l-smarc-module]
name = "RZ/G3L SMARC Module Board"
devices = ["rzg3l"]

[boards.rz-smarc-carrier2]
name = "RZ SMARC Series Carrier Board II"
devices = ["rzg3l", "rzg3e", "rzg3s"]
note = "Shared carrier board for several SMARC modules"

[boards.rz-smarc-rgb-hdmi2]
name = "RZ SMARC RGB-HDMI2 Adaptor"
devices = ["rzg3l"]

[boards.rz-smarc-breakout]
name = "RZ SMARC Breakout Board"
devices = ["rzg3l"]

[boards.rz-smarc-dual-lvds-hdmi]
name = "RZ SMARC Dual LVDS-HDMI Adaptor"
devices = ["rzg3l", "rzg3e"]

[boards.rz-smarc-pi-camera]
name = "RZ SMARC Pi Camera Adaptor"
devices = ["rzg3l", "rzg3e"]

[boards.rz-smarc-dsi-hdmi]
name = "RZ SMARC MIPI DSI-HDMI Adaptor"
devices = ["rzg3l"]

