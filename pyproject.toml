[project]
name = "rz-mcp"
version = "0.1.0"
description = "MCP server for Renesas RZ documentation (RZ/G3L pilot)"
requires-python = ">=3.11"
# Only the MCP server needs third-party packages. The indexers (build_fulltext / build_registers)
# use the standard library plus poppler-utils (pdftotext, pdftohtml) from the OS.
dependencies = ["mcp>=2.3,<3"]   # v2 API (MCPServer)

[project.scripts]
rz-mcp = "rzmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rzmcp"]
