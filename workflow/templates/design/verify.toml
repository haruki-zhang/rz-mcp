# TEMPLATE: 未填写。按 01-design.md 第 11 节写好每个验证项后，删除本行。格式见 workflow/board/evk-verify 的说明。
#
# where = "linux"：在板子的 Linux 里执行（串口，root 登录）；"host"：在主机上执行；
#         "boot"：从 Linux 重启并计时（U-Boot、Starting kernel、login 的时刻）。
# 结果只按 expect / expect_rc / max_seconds 判定。capture 取出的值可以在后面的 run 里用 ${名字} 引用。

[[check]]
id = "V-1"
title = "内核版本"
requirement = "1"
where = "linux"
run = "uname -r"
expect = "^6\\.12\\."

[[check]]
id = "V-2"
title = "启动到登录提示的时间"
requirement = "2"
where = "boot"
max_seconds = 15
