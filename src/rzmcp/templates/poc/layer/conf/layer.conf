# RZ/G3L {TITLE}: {SUMMARY}

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "{LAYER}"
BBFILE_PATTERN_{LAYER} = "^${LAYERDIR}/"

# Higher than the Renesas layers, so these bbappends apply last.
BBFILE_PRIORITY_{LAYER} = "20"

LAYERDEPENDS_{LAYER} = "core meta-rz-bsp"
LAYERSERIES_COMPAT_{LAYER} = "scarthgap"
